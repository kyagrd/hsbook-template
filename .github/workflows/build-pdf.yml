name: Build PDF

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Install Quarto ────────────────────────────────────────────────────
      - name: Install Quarto
        shell: bash
        run: |
          set -euxo pipefail
          QUARTO_VERSION="1.6.40"
          wget -q "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.deb"
          sudo dpkg -i "quarto-${QUARTO_VERSION}-linux-amd64.deb"
          quarto --version

      # ── 3. Install TeX Live with XeLaTeX and Korean language support ─────────
      - name: Install TeX Live (XeLaTeX + Korean)
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-korean

      # ── 4. Render PDF (code execution disabled) ──────────────────────────────
      #
      #   IHaskell (the Haskell Jupyter kernel) is not installed in CI,
      #   so we pass --execute false to skip code cell execution.
      #   This still validates the full LaTeX/PDF pipeline including
      #   kotex, scrbook, and the custom preamble.
      - name: Render PDF
        run: quarto render --to pdf --execute false

      # ── 5. Upload the built PDF as a workflow artifact ───────────────────────
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-pdf
          path: _book/*.pdf
          if-no-files-found: error
