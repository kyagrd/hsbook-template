name: Build PDF

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2 & 3 & 4. Install Quarto + TeX Live (full), then render PDF ─────────
      #
      #   xu-cheng/texlive-action runs commands inside a Docker container that
      #   ships a complete TeX Live installation (including XeLaTeX and kotex).
      #   We use the Debian-based image so that the Quarto .deb package installs
      #   correctly via dpkg.
      #
      #   IHaskell (the Haskell Jupyter kernel) is not installed in CI,
      #   so we pass --execute false to skip code cell execution.
      #   This still validates the full LaTeX/PDF pipeline including
      #   kotex, scrbook, and the custom preamble.
      - name: Render PDF
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          run: |
            set -euxo pipefail
            QUARTO_VERSION="1.6.40"
            wget -q "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.deb"
            dpkg -i "quarto-${QUARTO_VERSION}-linux-amd64.deb"
            quarto render --to pdf --execute false

      # ── 5. Upload the built PDF as a workflow artifact ───────────────────────
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-pdf
          path: _book/*.pdf
          if-no-files-found: error
